# Giga Grains — granular instrument and effect
# SPDX-License-Identifier: AGPL-3.0-or-later
# Copyright 2026, the Giga Grains authors (see git history)
#
# The required checks (INTENT §19):
#
#   build       macOS (universal), Windows (ClangCL) and Linux (gcc-12): gg-all and gg-products,
#               then ctest. ctest includes the golden event-log comparison, so this job is the
#               cross-platform determinism gate. On macOS the universal build's x86_64 slice runs
#               too, under Rosetta: the unit tests and the golden checks. Then clap-validator,
#               pluginval (strictness 10), auval (macOS) and Steinberg's VST3 validator. gg-bench
#               runs at full length (ruling T10-c) on pushes to main, on the nightly schedule and
#               on workflow_dispatch, and reports its in-process ratios, with a verdict against
#               the leg's baseline when there is one; report-only until 1.0.0 (ruling 3; INTENT
#               §23 #60, #61). On a pull request it runs --quick, as a smoke check only (no
#               verdict, no artifact). The gate turns blocking at 1.0.0, after M5, with the
#               published §16 headline (INTENT §16, §19).
#   sanitizers  ASan + UBSan, and RealtimeSanitizer, with upstream clang 20 (the pinned LLVM
#               20.1.8 release) on ubuntu-24.04.
#
# Once the build succeeds, every later check runs even if an earlier one failed, so one run
# reports them all; any failure still fails the job. The clang-format check is in format.yml.
#
# The release pipeline (docs/superpowers/specs/2026-10-29-release-pipeline-design.md §6.6):
#
#   plan        Runs first and decides the run's release_kind; every installer step, and the
#               release job, runs only when it isn't none:
#                 release   a pushed v* tag. plan fails fast unless the tag matches CMake's
#                           version (scripts/release/check-version.sh), docs/releases/<tag>.md
#                           exists, all seven signing secrets do, and the tagged commit is on main
#                           or a release/* branch. The release job makes a draft GitHub Release,
#                           which the director publishes by hand (docs/releasing.md).
#                 nightly   the schedule on main: the version gets the suffix
#                           dev.<yyyymmdd>.g<sha7>; the installers are kept as run artifacts and
#                           published as the nightly pre-release only when GG_PUBLISH_NIGHTLY is
#                           "true" (below), from M5, and only signed: plan fails a nightly that
#                           would publish without the signing secrets.
#                 dry-run   a workflow_dispatch with installers: true: the installers, signed when
#                           the secrets exist, as run artifacts; nothing is published.
#                 none      everything else: every pull request and push to main, a dispatch
#                           without installers, and any run in a fork. Today's run, unchanged.
#               A kind other than none fails in plan when only some of the seven signing secrets
#               are set (it names the missing ones, never a value); with none of them it builds
#               unsigned, except a release or a published nightly, which fails.
#   build       Its legs also sign (macOS, when the secrets exist) and pack the installers, after
#               every validator passed (gg-installer), and upload them as installer-<preset>.
#   release     After plan, build and sanitizers all passed: the source tarball, SHA256SUMS.txt
#               and, by kind, the draft release, the nightly pre-release, or a summary alone.
#
# Secrets never reach a pull request: release_kind is none there, and every step that reads one
# runs only when it isn't. No secret is ever echoed; each reaches its step through env.
#
# Every third-party action is pinned by commit SHA, with its tag or branch in the comment
# beside it.

name: CI

on:
  push:
    branches: [main]
    # A release tag (spec §6.1): v<numeric>[-<suffix>], matching CMake's version.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      installers:
        description: "Build and sign the installers and upload them as artifacts; publish nothing"
        type: boolean
        default: false
  # The nightly full-length benchmark (and a fresh run of everything else) on main.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  # The public nightly (spec decision 10): "false" until M5 begins, when this is flipped to
  # "true" (INTENT §23 #61). Nothing is public, and there is no nightly release, before M5
  # (§23 #62); until then the nightly run still builds and signs the installers and keeps them
  # as run artifacts.
  GG_PUBLISH_NIGHTLY: "false"

# A newer push to a pull request cancels that pull request's run in progress. Every other run
# (a push to main, the nightly, a dispatch) has a group of its own, so none is cancelled and a
# queued full benchmark is never replaced by a later run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # What this run releases (spec §6.6), decided once, before anything builds; see the header.
  # Its outputs: release_kind (release, nightly, dry-run or none); version, the full version the
  # installers carry (release: check-version.sh's; nightly: CMake's numeric part plus
  # -dev.<yyyymmdd>.g<sha7>, the g before the hash as git describe has it, so a hash of digits
  # alone with a leading zero is still a valid semver identifier; dry-run: CMake's own, as the
  # configure composes it; none: empty); prerelease_suffix, the part of version after its first
  # '-' (empty for a bare release, dev when version is empty); tag, the release's tag; sign, true
  # when the installers are signed (not none, and all seven signing secrets are set). A run in a
  # fork always gets none, so a fork's schedule never tries to sign. Full history (fetch-depth
  # 0), in this job alone, for the tag's branch check (the hotfix rule of spec §1: main or a
  # release/* branch).
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_kind: ${{ steps.plan.outputs.release_kind }}
      version: ${{ steps.plan.outputs.version }}
      prerelease_suffix: ${{ steps.plan.outputs.prerelease_suffix }}
      tag: ${{ steps.plan.outputs.tag }}
      sign: ${{ steps.plan.outputs.sign }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the run
        id: plan
        env:
          GG_INSTALLERS: ${{ inputs.installers }}
          # Only whether each signing secret is set (true or false), never its value.
          GG_HAVE_MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 != '' }}
          GG_HAVE_MAC_CERTS_P12_PASSWORD: ${{ secrets.MAC_CERTS_P12_PASSWORD != '' }}
          GG_HAVE_MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY != '' }}
          GG_HAVE_MAC_INSTALLER_IDENTITY: ${{ secrets.MAC_INSTALLER_IDENTITY != '' }}
          GG_HAVE_NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 != '' }}
          GG_HAVE_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID != '' }}
          GG_HAVE_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID != '' }}
        run: |
          fail() {
            echo "::error title=plan::$1"
            echo "plan: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          kind=none
          if [[ "$GITHUB_REPOSITORY" != sethbc/giga-grains ]]; then
            echo "A fork ($GITHUB_REPOSITORY): nothing is signed, packed or published."
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            kind=release
          elif [[ "$GITHUB_EVENT_NAME" == schedule && "$GITHUB_REF" == refs/heads/main ]]; then
            kind=nightly
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GG_INSTALLERS" == true ]]; then
            kind=dry-run
          fi
          version=""
          tag=""
          case "$kind" in
            release)
              tag="${GITHUB_REF#refs/tags/}"
              # check-version.sh prints its own one-line reason on a mismatch or the suffix dev.
              lines="$(scripts/release/check-version.sh "$tag")" ||
                fail "the tag $tag does not match CMake's version (check-version.sh, above)"
              version="$(sed -n 's/^version=//p' <<<"$lines")"
              [[ -f "docs/releases/$tag.md" ]] ||
                fail "docs/releases/$tag.md, the release notes, is missing (docs/releases/README.md)"
              commit="$(git rev-parse 'HEAD^{commit}')"
              branch=""
              for ref in origin/main $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/release/*'); do
                if git merge-base --is-ancestor "$commit" "$ref"; then
                  branch="$ref"
                  break
                fi
              done
              [[ -n "$branch" ]] ||
                fail "the tagged commit $commit is on neither origin/main nor an origin/release/* branch"
              echo "The tagged commit $commit is on $branch."
              ;;
            nightly)
              numeric="$(scripts/release/check-version.sh --print | sed -n 's/^numeric=//p')"
              [[ -n "$numeric" ]] || fail "check-version.sh --print gave no numeric version"
              version="$numeric-dev.$(date -u +%Y%m%d).g${GITHUB_SHA:0:7}"
              ;;
            dry-run)
              version="$(scripts/release/check-version.sh --print | sed -n 's/^version=//p')"
              [[ -n "$version" ]] || fail "check-version.sh --print gave no version"
              ;;
          esac
          if [[ -z "$version" ]]; then
            suffix=dev
          elif [[ "$version" == *-* ]]; then
            suffix="${version#*-}"
          else
            suffix=""
          fi
          # The signing secrets, by name only: all seven sign, none builds unsigned, and some is
          # a mistake that would fail only later, in the macOS leg. A release is always signed,
          # and so is a published nightly (its notes say the macOS installer is).
          have=0
          missing=""
          for name in MAC_CERTS_P12 MAC_CERTS_P12_PASSWORD MAC_SIGNING_IDENTITY \
              MAC_INSTALLER_IDENTITY NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            flag="GG_HAVE_$name"
            if [[ "${!flag}" == true ]]; then
              have=$((have + 1))
            else
              missing="$missing $name"
            fi
          done
          if [[ "$kind" != none && "$have" -ne 7 ]]; then
            if [[ "$kind" == release ]]; then
              fail "a release is always signed, and these signing secrets are not set:$missing"
            elif [[ "$have" -ne 0 ]]; then
              fail "only some of the seven signing secrets are set (set all or none); not set:$missing"
            elif [[ "$kind" == nightly && "$GG_PUBLISH_NIGHTLY" == true ]]; then
              fail "GG_PUBLISH_NIGHTLY is true, and a published nightly is always signed; not set:$missing"
            fi
          fi
          sign=false
          if [[ "$kind" != none && "$have" -eq 7 ]]; then
            sign=true
          fi
          {
            echo "release_kind=$kind"
            echo "version=$version"
            echo "prerelease_suffix=$suffix"
            echo "tag=$tag"
            echo "sign=$sign"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### plan"
            echo "release_kind=$kind, version=${version:-(none)}, prerelease_suffix=${suffix:-(empty)}, sign=$sign"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.preset }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not macos-latest, so the M1 CPU baseline's runner doesn't float. macos-latest
          # was this image (macos-26-arm64, an Apple M1 VM) for M0's recorded runs.
          - os: macos-26
            preset: mac-universal
            build_dir: build/mac-universal
            bench: build/mac-universal/tools/gg-bench/gg-bench
          - os: windows-2022
            preset: windows-clangcl
            build_dir: build/windows
            bench: build/windows/tools/gg-bench/Release/gg-bench.exe
            exe: .exe
          - os: ubuntu-22.04
            preset: linux-gcc12
            build_dir: build/linux-gcc12
            bench: build/linux-gcc12/tools/gg-bench/gg-bench
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      # The SDKs that clap-wrapper would download at configure time (the VST3 SDK, Apple's
      # AudioUnitSDK, RtAudio, RtMidi and the Windows helper library, wil) are fetched by
      # scripts/fetch-sdks.sh into this directory at exactly the tags clap-wrapper pins, and
      # Configure points clap-wrapper at them (-DVST3_SDK_ROOT and the like). CPM's own cache
      # (CPM_SOURCE_CACHE) can't do this: clap-wrapper gives every package a SOURCE_DIR, which
      # makes CPM skip it. The cache never changes what is built, only whether it is downloaded
      # (carry-over [96]).
      SDK_CACHE_DIR: ${{ github.workspace }}/.sdk-cache
      # ccache for the macOS and Linux legs, CI only (the local presets are unchanged): the
      # launcher is passed at configure, and the cache never changes what is built, because
      # ccache hashes the whole compile command (every flag, -ffp-contract=off among them, the
      # definitions and the compiler's identity) and the preprocessed source. The workspace has
      # the same path on every run, so base_dir only makes that explicit; hash_dir off keeps the
      # working directory out of the hash (the legs compile with the same one every time). No
      # __DATE__ or __TIME__ is used in first-party code.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "1"
      # The plan job's decision (see the header); every installer step runs only when the kind
      # isn't none.
      GG_RELEASE_KIND: ${{ needs.plan.outputs.release_kind }}
      GG_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Already shallow, now explicit: with fetch-depth 1 (the default) the action runs
          # `git submodule update --init --force --depth=1 --recursive`, so every submodule is
          # fetched at its exact pinned commit only. Spelling it out changes nothing and brings
          # no speed-up.
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      # The SDK checkouts, keyed by leg and by the files that hold the pins (clap-wrapper's
      # base_sdks.cmake, which names every tag, and the script that fetches them), so a changed
      # pin starts a fresh cache. Every cache here is restored by every run and saved only on
      # main (a push, the nightly or a dispatch on main): GitHub scopes a cache to the ref that
      # saved it, and a pull request can read main's but nobody reads a pull request's.
      - name: Restore the SDK checkouts
        id: sdk_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.SDK_CACHE_DIR }}
          key: sdks-${{ matrix.preset }}-${{ hashFiles('libs/clap/clap-wrapper/cmake/base_sdks.cmake', 'scripts/fetch-sdks.sh') }}

      # On a hit every checkout is kept (its recorded pin matches) and nothing is downloaded; on
      # a miss, each SDK is cloned at its pinned tag. Either way the script writes the -D options
      # that Configure passes. Saved right here on a miss, so a later failure doesn't lose it.
      - name: Fetch the SDKs
        run: |
          scripts/fetch-sdks.sh "$SDK_CACHE_DIR" | tee "$RUNNER_TEMP/fetch-sdks.log"
          tr -d '\r' < "$RUNNER_TEMP/fetch-sdks.log" | grep '^-D' > "$SDK_CACHE_DIR/options.txt"
          echo "### SDK cache (${{ matrix.preset }}): hit=${{ steps.sdk_cache.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the SDK checkouts
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.sdk_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.SDK_CACHE_DIR }}
          key: ${{ steps.sdk_cache.outputs.cache-primary-key }}

      - name: Prepare for JUCE
        uses: surge-synthesizer/sst-githubactions/prepare-for-juce@5bb92ec9d3401eba6a85f8edea98395b3b866e84 # main
        with:
          os: ${{ runner.os }}
          gccversion: 12

      # libxi-dev: JUCE 9's juce_gui_basics includes <X11/extensions/XInput2.h> on Linux
      # (JUCE_USE_XINPUT defaults to 1), and prepare-for-juce doesn't install it.
      - name: Install Ninja, Xvfb and libxi-dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build xvfb libxi-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja

      # ccache on macOS and Linux. Windows builds with the Visual Studio generator
      # (ClangCL toolset), which has no compiler-launcher support, so that leg is uncached.
      # (The universal macOS build compiles each file for two architectures, which ccache
      # passes through uncached; the leg still gets the cache for its single-arch compiles.)
      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: command -v ccache || brew install ccache

      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ccache

      # Saved (below) only on main, so pull requests don't fill the repository's cache quota
      # with a 500 MB cache per leg per run.
      - name: Restore the compiler cache
        if: runner.os != 'Windows'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.os }}-

      # macOS, when the run signs (plan's sign: a kind other than none, and the secrets exist):
      # the Developer ID certificates go into a throwaway keychain (scripts/release/mac-keychain.sh)
      # before Configure names the identity, so the build signs every bundle with it, and the
      # notary key is decoded for the installer step. Each identity secret must name one of the
      # keychain's valid identities, by its name (inside find-identity's quotes) or its SHA-1 hash
      # (before them), or the step fails here, naming the secret, rather than at the first
      # codesign or pkgbuild. GG_SIGN=1 tells the later steps. Each secret reaches the step through
      # env and is decoded into $RUNNER_TEMP, never echoed; the keychain and both files are deleted
      # in an always() step at the end of the job.
      - name: Import the signing certificates (macOS)
        id: keychain
        if: ${{ needs.plan.outputs.release_kind != 'none' && needs.plan.outputs.sign == 'true' && runner.os == 'macOS' }}
        env:
          MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERTS_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          MAC_INSTALLER_IDENTITY: ${{ secrets.MAC_INSTALLER_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$MAC_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          scripts/release/mac-keychain.sh import "$RUNNER_TEMP/certs.p12" "$keychain"
          rm -f "$RUNNER_TEMP/certs.p12"
          # has_identity <variable> <find-identity option>...: true when the variable's value is
          # the name or the SHA-1 hash of a valid identity in the keychain. It prints neither the
          # value nor find-identity's listing; bash 3.2, so the regex is in a variable.
          has_identity() {
            local value="${!1}" line hash re='^[[:space:]]*[0-9]+\)[[:space:]]+([0-9A-Fa-f]{40})[[:space:]]+"(.*)"'
            shift
            hash="$(printf '%s' "$value" | tr '[:lower:]' '[:upper:]')"
            while IFS= read -r line; do
              if [[ "$line" =~ $re ]]; then
                if [[ "${BASH_REMATCH[2]}" == "$value" || "${BASH_REMATCH[1]}" == "$hash" ]]; then
                  return 0
                fi
              fi
            done <<<"$(security find-identity -v "$@" "$keychain")"
            return 1
          }
          has_identity MAC_SIGNING_IDENTITY -p codesigning || {
            echo "::error title=signing::MAC_SIGNING_IDENTITY names no valid code-signing identity in the .p12 (MAC_CERTS_P12)"
            exit 1
          }
          has_identity MAC_INSTALLER_IDENTITY || {
            echo "::error title=signing::MAC_INSTALLER_IDENTITY names no valid identity in the .p12 (MAC_CERTS_P12)"
            exit 1
          }
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "GG_SIGN=1" >> "$GITHUB_ENV"

      # A nightly passes its pre-release suffix (dev.<yyyymmdd>.g<sha7>, from plan); a release's
      # suffix is already CMake's (plan checked it). A signing run names the Developer ID, which
      # turns on the hardened runtime, the timestamp and the apps' entitlement (spec §6.2).
      - name: Configure
        id: configure
        env:
          GG_PRERELEASE_SUFFIX: ${{ needs.plan.outputs.prerelease_suffix }}
          MAC_SIGNING_IDENTITY: ${{ env.GG_SIGN == '1' && secrets.MAC_SIGNING_IDENTITY || '' }}
        run: |
          # A loop, not mapfile: the macOS runner's bash is 3.2.
          sdk_roots=()
          while IFS= read -r line || [ -n "$line" ]; do
            if [ -n "$line" ]; then sdk_roots+=("$line"); fi
          done < "$SDK_CACHE_DIR/options.txt"
          launcher=()
          if [[ "$RUNNER_OS" != Windows ]]; then
            ccache --zero-stats
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
              -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache)
          fi
          release_opts=()
          if [[ "$GG_RELEASE_KIND" == nightly ]]; then
            release_opts+=("-DGG_VERSION_PRERELEASE=$GG_PRERELEASE_SUFFIX")
          fi
          if [[ "${GG_SIGN:-}" == 1 ]]; then
            release_opts+=("-DGG_MACOS_CODESIGN_IDENTITY=$MAC_SIGNING_IDENTITY")
          fi
          cmake --preset ${{ matrix.preset }} "${sdk_roots[@]}" "${launcher[@]}" "${release_opts[@]}"

      - name: Build gg-all and gg-products
        id: build
        run: cmake --build --preset ${{ matrix.preset }} --config Release --parallel --target gg-all gg-products

      - name: Compiler cache statistics
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: |
          {
            echo "### ccache (${{ matrix.preset }})"
            echo '```'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Saved even when the build failed (what it compiled is still good), but not by a pull
      # request.
      - name: Save the compiler cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && runner.os != 'Windows' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.os }}-${{ github.sha }}

      - name: Test (unit, plugin and golden)
        run: ctest --preset ${{ matrix.preset }} -C Release --output-on-failure

      # The arm64 runner otherwise never runs the universal build's x86_64 slice. Under Rosetta 2
      # it runs the whole Catch2 suite, then every golden case with the same commands as the
      # golden CTests, so the slice's grain-event logs are checked against the same goldens.
      # The x86_64 slice writes the cases' media itself first (the media go through libm), as
      # the golden_media fixture does, and every render resolves their paths there.
      # arch -x86_64 fails on a binary without an x86_64 slice.
      - name: Test the x86_64 slice under Rosetta (macOS)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 20
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          build_dir="${{ matrix.build_dir }}"
          tests="$build_dir/tests/gg-tests"
          render="$build_dir/tools/gg-render/gg-render"
          echo "gg-tests: $(lipo -archs "$tests"); gg-render: $(lipo -archs "$render")"
          arch -x86_64 "$tests"
          out="$build_dir/golden-x86_64"
          arch -x86_64 "$render" --write-media "$out-media"
          for spec in tests/golden/cases/*.json; do
            name="$(basename "$spec" .json)"
            arch -x86_64 "$render" "$spec" \
              --media-dir "$out-media" \
              -o "$out/$name.wav" \
              --spectrogram "$out/$name.png" \
              --compare "tests/golden/expected/$name.metrics.json" \
              --compare-events "tests/golden/expected/$name.events.jsonl"
          done

      # Full length on pushes to main, the nightly schedule and workflow_dispatch; --quick on a
      # pull request. A quick run is a smoke check: it must not crash, but its ratios are too
      # noisy for the baseline, so it checks none, prints no verdict and uploads nothing.
      # Reported, not gated until 1.0.0 (ruling 3; INTENT §16, §19, §23 #61). gg-bench times the kernels,
      # the frozen reference kernel and the real engine at full length (runs of 2 s, 5 interleaved
      # rounds; ruling T10-c) and reports each engine case's ratio to the reference,
      # which cancels the runner's speed but not its microarchitecture. When this leg has a
      # baseline (tools/gg-bench/baselines/<preset>.json), gg-bench checks the ratios against its
      # entry for the runner's CPU model and prints a verdict per ratio. GitHub assigns a leg
      # different models from run to run, and their ratios differ by up to ~20%. For a model the
      # baseline doesn't have yet, gg-bench prints "no baseline for <machine>; no verdict" and
      # exits 0; the summary repeats that line above the output. A ratio never fails the job: a
      # regression (exit 3) becomes a warning and the step exits 0, so the artifact still
      # uploads; sub-project 6 makes it blocking. Anything else still fails the job, as before: a
      # crash, an engine fault, a malformed baseline (exit 1), bad usage (2) or the timeout. The
      # bench_baseline_* tests pin exit 3 for a regression, exit 0 for a pass, and exit 0 with
      # the no-verdict line for a model the baseline lacks. A full run is time-boxed: about 6
      # minutes on every leg; a quick one takes under a minute.
      - name: Benchmark (full length on main, nightly and dispatch, else --quick; not gated until 1.0.0)
        id: bench
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          out="${{ matrix.build_dir }}/gg-bench"
          baseline="tools/gg-bench/baselines/${{ matrix.preset }}.json"
          args=(--commit "${{ github.sha }}" --json "$out.json")
          quick=false
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            quick=true
            args+=(--quick)
          elif [[ -f "$baseline" ]]; then
            args+=(--baseline "$baseline")
          fi
          set +e
          "${{ matrix.bench }}" "${args[@]}" | tee "$out.txt"
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### gg-bench (${{ matrix.preset }})"
            # The grep strips CRs first: on windows-clangcl the output's lines end in CRLF.
            if [[ $quick == true ]]; then
              echo "Quick smoke run (pull request): no baseline check, no verdict."
            elif [[ ! -f "$baseline" ]]; then
              echo "No baseline for this leg yet ($baseline): ratios reported, no verdict."
            elif no_verdict=$(tr -d '\r' < "$out.txt" | grep -m 1 '^no baseline for .*; no verdict$'); then
              echo "$no_verdict (ratios reported)."
            fi
            echo '```'
            cat "$out.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ $status == 3 ]]; then
            echo "::warning title=gg-bench::a ratio regressed, or a baseline entry is missing from the run, against $baseline (report-only until 1.0.0)"
            status=0
          fi
          exit "$status"

      - name: Locate the products
        id: products
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          products="$PWD/${{ matrix.build_dir }}/gg-products"
          ls -la "$products"
          native() {
            if [[ "$RUNNER_OS" == Windows ]]; then cygpath -w "$1"; else echo "$1"; fi
          }
          for name in "Giga Grains.clap" "Giga Grains.vst3"; do
            test -e "$products/$name"
          done
          echo "GG_CLAP=$(native "$products/Giga Grains.clap")" >> "$GITHUB_ENV"
          echo "GG_VST3=$(native "$products/Giga Grains.vst3")" >> "$GITHUB_ENV"

      - name: Fetch clap-validator and pluginval
        id: validators
        if: ${{ !cancelled() && steps.products.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/fetch-validators.sh tools-bin

      - name: clap-validator
        if: ${{ !cancelled() && steps.validators.outcome == 'success' }}
        timeout-minutes: 10
        run: tools-bin/clap-validator${{ matrix.exe }} validate "$GG_CLAP"

      - name: pluginval (VST3, strictness 10)
        if: ${{ !cancelled() && steps.validators.outcome == 'success' && runner.os != 'Linux' }}
        timeout-minutes: 20
        run: tools-bin/pluginval${{ matrix.exe }} --strictness-level 10 --validate "$GG_VST3"

      - name: pluginval (VST3, strictness 10, Xvfb)
        if: ${{ !cancelled() && steps.validators.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 20
        run: xvfb-run -a tools-bin/pluginval --strictness-level 10 --skip-gui-tests --validate "$GG_VST3"

      # All three identities are validated even if one fails, so one run reports them all. Each
      # run streams into a collapsed log group and into a file; a failure prints an error and the
      # tail of that run's output outside the group, so it reads without expanding anything.
      - name: auval
        if: ${{ !cancelled() && steps.products.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 15
        run: |
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          rm -rf "$components/Giga Grains.component"
          cp -R "${{ matrix.build_dir }}/gg-products/Giga Grains.component" "$components/"
          killall -9 AudioComponentRegistrar || true
          # Wait for the component registrar to pick up the new component. auval -a writes to a
          # file, so no pipe can close on it early.
          list="$RUNNER_TEMP/auval-list.log"
          registered=false
          for _ in $(seq 1 15); do
            auval -a > "$list" 2>&1 || true
            if grep -q Sbcx "$list"; then
              registered=true
              break
            fi
            sleep 2
          done
          if [[ "$registered" != true ]]; then
            echo "::error::auval -a lists no Sbcx component after 30 s"
            echo "---- last 40 lines of auval -a ----"
            tail -n 40 "$list"
            exit 1
          fi
          grep Sbcx "$list"
          failed=0
          for id in "aumu GGin Sbcx" "aufx GGfx Sbcx" "aumf GGfx Sbcx"; do
            log="$RUNNER_TEMP/auval-${id// /-}.log"
            status=0
            echo "::group::auval -v $id"
            # $id is split on purpose: auval takes type, subtype and manufacturer separately.
            # shellcheck disable=SC2086
            auval -v $id 2>&1 | tee "$log" || status=$?
            echo "::endgroup::"
            if [[ $status -ne 0 ]] || ! grep -q "AU VALIDATION SUCCEEDED" "$log"; then
              echo "::error::auval -v $id failed: exit status $status, or no AU VALIDATION SUCCEEDED"
              echo "---- last 60 lines of auval -v $id ----"
              tail -n 60 "$log"
              failed=1
            else
              echo "auval -v $id: AU VALIDATION SUCCEEDED"
            fi
          done
          exit "$failed"

      # The VST3 SDK that Configure used (VST3_SDK_ROOT, from the SDK cache) includes public.sdk,
      # so the validator (public.sdk/samples/vst-hosting/validator) is built from that same
      # checkout.
      - name: Build Steinberg's VST3 validator
        id: vst3_validator
        if: ${{ !cancelled() && steps.products.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          build_dir="${{ matrix.build_dir }}"
          cache="$build_dir/CMakeCache.txt"
          sdk="$(sed -n 's/^VST3_SDK_ROOT:[A-Z]*=//p' "$cache" | tr -d '\r')"
          echo "VST3 SDK: $sdk"
          test -f "$sdk/public.sdk/samples/vst-hosting/validator/CMakeLists.txt"
          if [[ "$RUNNER_OS" == Windows ]]; then
            generator=(-G "Visual Studio 17 2022" -A x64)
          else
            generator=(-G Ninja)
          fi
          cmake -S "$sdk" -B "$build_dir/vst3-validator" "${generator[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF \
            -DSMTG_CREATE_PLUGIN_LINK=OFF \
            -DSMTG_BUILD_UNIVERSAL_BINARY=OFF
          cmake --build "$build_dir/vst3-validator" --config Release --parallel --target validator

      - name: Steinberg VST3 validator
        if: ${{ !cancelled() && steps.vst3_validator.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          "${{ matrix.build_dir }}/vst3-validator/bin/Release/validator${{ matrix.exe }}" "$GG_VST3"

      # When the kind isn't none, and only when every step above passed (no !cancelled()), so an
      # installer is packed only from products that passed every test and validator: gg-installer
      # (cmake/products.cmake) writes the leg's installer into <build dir>/gg-installer/. On
      # macOS the signing variables are set, from secrets, only when GG_SIGN is (empty means
      # unset to installer/macos/make-installer.sh), and its `signed:` line must agree with
      # GG_SIGN; Windows ships unsigned (spec decision 3) and Linux has nothing to sign. The
      # expected files, named by plan's version, are staged in $RUNNER_TEMP/installer for the
      # upload: macOS the DMG (the PKG is inside it), Windows the zip and the Inno Setup EXE
      # (GG_ISCC must have been found at configure), Linux the tarball.
      - name: Build the installer
        id: installer
        if: ${{ needs.plan.outputs.release_kind != 'none' && steps.products.outcome == 'success' }}
        timeout-minutes: 70
        env:
          MAC_SIGNING_IDENTITY: ${{ env.GG_SIGN == '1' && secrets.MAC_SIGNING_IDENTITY || '' }}
          MAC_INSTALLER_IDENTITY: ${{ env.GG_SIGN == '1' && secrets.MAC_INSTALLER_IDENTITY || '' }}
          NOTARY_KEY_ID: ${{ env.GG_SIGN == '1' && secrets.NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER_ID: ${{ env.GG_SIGN == '1' && secrets.NOTARY_ISSUER_ID || '' }}
          NOTARY_KEY_FILE: ${{ env.GG_SIGN == '1' && format('{0}/AuthKey.p8', runner.temp) || '' }}
        run: |
          log="$RUNNER_TEMP/gg-installer.log"
          cmake --build --preset ${{ matrix.preset }} --config Release --target gg-installer 2>&1 | tee "$log"
          dir="${{ matrix.build_dir }}/gg-installer"
          case "$RUNNER_OS" in
            macOS) files=("giga-grains-$GG_VERSION-macos.dmg") ;;
            Windows) files=("giga-grains-$GG_VERSION-windows-x64.zip" "giga-grains-$GG_VERSION-windows-x64.exe") ;;
            *) files=("giga-grains-$GG_VERSION-linux-x86_64.tar.gz") ;;
          esac
          stage="$RUNNER_TEMP/installer"
          rm -rf "$stage"
          mkdir -p "$stage"
          for file in "${files[@]}"; do
            if [[ ! -f "$dir/$file" ]]; then
              echo "::error title=gg-installer::no $file in $dir"
              ls -la "$dir" || true
              exit 1
            fi
            cp "$dir/$file" "$stage/"
          done
          if [[ "$RUNNER_OS" == macOS ]]; then
            signed="$(tr -d '\r' < "$log" | grep -E '^signed: (yes|no)$' | tail -n 1 | cut -d ' ' -f 2 || true)"
            expected=no
            if [[ "${GG_SIGN:-}" == 1 ]]; then
              expected=yes
            fi
            if [[ "$signed" != "$expected" ]]; then
              echo "::error title=gg-installer::make-installer.sh said signed: ${signed:-(nothing)}, expected signed: $expected"
              exit 1
            fi
          else
            signed=no
          fi
          {
            echo "### Installer (${{ matrix.preset }}, $GG_RELEASE_KIND, $GG_VERSION)"
            echo "signed: $signed"
            echo '```'
            ls -l "$stage"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the installer
        if: ${{ steps.installer.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.preset }}
          path: ${{ runner.temp }}/installer/
          if-no-files-found: error

      - name: Upload golden renders
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-${{ matrix.preset }}
          path: ${{ matrix.build_dir }}/golden/
          if-no-files-found: ignore

      - name: Upload benchmark
        if: ${{ !cancelled() && steps.bench.outcome == 'success' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gg-bench-${{ matrix.preset }}
          path: |
            ${{ matrix.build_dir }}/gg-bench.json
            ${{ matrix.build_dir }}/gg-bench.txt
          if-no-files-found: error

      # Whenever the import ran, whatever happened since (also on a failure or a cancel): the
      # throwaway keychain leaves the search list and is deleted, with the decoded secrets.
      - name: Delete the signing keychain (macOS)
        if: ${{ always() && runner.os == 'macOS' && (steps.keychain.outcome == 'success' || steps.keychain.outcome == 'failure') }}
        run: |
          rm -f "$RUNNER_TEMP/certs.p12" "$RUNNER_TEMP/AuthKey.p8"
          scripts/release/mac-keychain.sh delete "$RUNNER_TEMP/signing.keychain-db"

  sanitizers:
    name: sanitizers (asan, rtsan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # LLVM's official 20.1.8 release for Linux x64, checked against its SHA-256 (the digest
      # GitHub publishes for the release asset). RTSan needs upstream clang 20 or newer.
      LLVM_VERSION: 20.1.8
      LLVM_SHA256: 1ead36b3dfcb774b57be530df42bec70ab2d239fbce9889447c7a29a4ddc1ae6
      # The rtsan preset takes its compilers from $GG_LLVM; the asan step uses the same clang.
      GG_LLVM: /opt/llvm-20.1.8
      # ccache, as in the build job (CI only; the same notes apply).
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1 # already the default; see the build job
          submodules: recursive
          persist-credentials: false

      # The whole release unpacks to 11.6 GB, mostly tools we don't use, so only clang, its
      # resource directory (headers and the sanitizer runtimes, RTSan's included) and
      # llvm-symbolizer (readable sanitizer stack traces) are extracted.
      # The release archive is cached by version and SHA-256, so a changed pin misses. The
      # SHA-256 check below runs on a hit too: a cached archive is trusted no more than a
      # downloaded one.
      - name: Restore the LLVM archive
        id: llvm_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/llvm-archive
          key: llvm-${{ env.LLVM_VERSION }}-${{ env.LLVM_SHA256 }}

      - name: Install LLVM 20.1.8 (pinned release) and Ninja
        id: toolchain
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache
          name="LLVM-$LLVM_VERSION-Linux-X64"
          mkdir -p "$RUNNER_TEMP/llvm-archive"
          archive="$RUNNER_TEMP/llvm-archive/$name.tar.xz"
          if [[ ! -f "$archive" ]]; then
            curl -fsSL --retry 3 -o "$archive" \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.xz"
          fi
          echo "$LLVM_SHA256  $archive" | sha256sum --check --strict
          sudo mkdir -p "$GG_LLVM"
          sudo tar -xJf "$archive" -C "$GG_LLVM" --strip-components=1 \
            "$name/bin/clang" "$name/bin/clang++" "$name/bin/clang-20" \
            "$name/bin/llvm-symbolizer" "$name/lib/clang/20"
          echo "$GG_LLVM/bin" >> "$GITHUB_PATH"
          "$GG_LLVM/bin/clang++" --version
          ls "$GG_LLVM/lib/clang/20/lib/x86_64-unknown-linux-gnu/libclang_rt.rtsan.a"

      - name: Save the LLVM archive
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.llvm_cache.outputs.cache-hit != 'true' && steps.toolchain.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/llvm-archive
          key: llvm-${{ env.LLVM_VERSION }}-${{ env.LLVM_SHA256 }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sanitizers-llvm-${{ env.LLVM_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-sanitizers-llvm-${{ env.LLVM_VERSION }}-

      - name: ASan + UBSan
        env:
          CC: ${{ env.GG_LLVM }}/bin/clang
          CXX: ${{ env.GG_LLVM }}/bin/clang++
        run: |
          launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          ccache --zero-stats
          cmake --preset asan "${launcher[@]}"
          cmake --build --preset asan --parallel --target gg-all
          ctest --preset asan --output-on-failure

      - name: RealtimeSanitizer
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          cmake --preset rtsan "${launcher[@]}"
          cmake --build --preset rtsan --parallel --target gg-all
          ctest --preset rtsan --output-on-failure

      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### ccache (sanitizers)"
            echo '```'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the compiler cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sanitizers-llvm-${{ env.LLVM_VERSION }}-${{ github.sha }}

  # When the kind isn't none, and only after plan, every build leg and the sanitizers passed (a
  # red sanitizer run blocks a release). The only job that may write to the repository
  # (contents: write, for the release; actions: read, to download this run's artifacts with gh).
  # It downloads the three legs' installer-* artifacts, writes the complete corresponding source
  # (scripts/release/source-tarball.sh, from a recursive checkout; spec decision 11) and
  # SHA256SUMS.txt over every file, then, by kind: release makes a draft release of the tag,
  # which the director publishes by hand; nightly moves the nightly tag and updates the nightly
  # pre-release, only when GG_PUBLISH_NIGHTLY is "true"; dry-run only lists the files. gh, with
  # the job's own token: no third-party action.
  release:
    name: release
    needs: [plan, build, sanitizers]
    if: ${{ needs.plan.outputs.release_kind != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GG_RELEASE_KIND: ${{ needs.plan.outputs.release_kind }}
      GG_VERSION: ${{ needs.plan.outputs.version }}
      GG_PRERELEASE_SUFFIX: ${{ needs.plan.outputs.prerelease_suffix }}
      GG_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1 # already the default; see the build job
          submodules: recursive
          persist-credentials: false

      # Every file the release carries, in $RUNNER_TEMP/dist: the four installers by name, the
      # source tarball, and SHA256SUMS.txt over them.
      - name: Gather the release files
        run: |
          artifacts="$RUNNER_TEMP/artifacts"
          dist="$RUNNER_TEMP/dist"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'installer-*' \
            --dir "$artifacts"
          mkdir -p "$dist"
          find "$artifacts" -type f -exec mv {} "$dist/" \;
          for file in "giga-grains-$GG_VERSION-macos.dmg" \
              "giga-grains-$GG_VERSION-windows-x64.zip" "giga-grains-$GG_VERSION-windows-x64.exe" \
              "giga-grains-$GG_VERSION-linux-x86_64.tar.gz"; do
            if [[ ! -f "$dist/$file" ]]; then
              echo "::error title=release::no $file among this run's installer-* artifacts"
              ls -la "$dist"
              exit 1
            fi
          done
          scripts/release/source-tarball.sh . "$GG_VERSION" "$dist/giga-grains-$GG_VERSION-source.tar.gz"
          (cd "$dist" && sha256sum -- *) > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" "$dist/SHA256SUMS.txt"
          cat "$dist/SHA256SUMS.txt"
          echo "GG_DIST=$dist" >> "$GITHUB_ENV"

      # A draft, never published here: the director publishes it by hand after installing from it
      # (docs/releasing.md). A pre-release when the version has a suffix. --verify-tag: the tag
      # must exist already; nothing here creates one. A rerun refuses to make a second draft.
      - name: Make the draft release (release)
        if: ${{ needs.plan.outputs.release_kind == 'release' }}
        run: |
          if gh release view "$GG_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error title=release::a release for $GG_TAG exists already; delete the draft to make it again"
            exit 1
          fi
          prerelease=()
          if [[ -n "$GG_PRERELEASE_SUFFIX" ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GG_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            "${prerelease[@]}" --title "Giga Grains $GG_VERSION" \
            --notes-file "docs/releases/$GG_TAG.md" "$GG_DIST"/*
          {
            echo "### release: draft $GG_TAG made (Giga Grains $GG_VERSION${GG_PRERELEASE_SUFFIX:+, a pre-release})"
            echo '```'
            (cd "$GG_DIST" && ls -l)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # From M5 (GG_PUBLISH_NIGHTLY), and only signed (plan fails a nightly that would publish
      # unsigned; the sign check here is a second guard): the nightly tag moves to this commit
      # (through the API, as the checkout keeps no credentials), the nightly pre-release is made
      # or its notes updated (installer/nightly-notes.md plus this build's version and commit),
      # every asset not in this run's set is deleted, and this run's are uploaded. Published
      # directly, not a draft. git/ref/ (singular) matches the tag exactly; git/refs/ would also
      # answer for a prefix, such as a tag nightly-old.
      - name: Publish the nightly (nightly, from M5)
        if: ${{ needs.plan.outputs.release_kind == 'nightly' && env.GG_PUBLISH_NIGHTLY == 'true' && needs.plan.outputs.sign == 'true' }}
        run: |
          repo="$GITHUB_REPOSITORY"
          if gh api "repos/$repo/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$repo/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$repo/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" > /dev/null
          fi
          notes="$RUNNER_TEMP/nightly-notes.md"
          {
            cat installer/nightly-notes.md
            echo
            echo "This build: Giga Grains $GG_VERSION, from commit $GITHUB_SHA."
          } > "$notes"
          if gh release view nightly --repo "$repo" > /dev/null 2>&1; then
            gh release edit nightly --repo "$repo" --prerelease --title "Giga Grains nightly" \
              --notes-file "$notes"
          else
            gh release create nightly --repo "$repo" --verify-tag --prerelease \
              --title "Giga Grains nightly" --notes-file "$notes"
          fi
          gh release view nightly --repo "$repo" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              if [[ -n "$asset" && ! -f "$GG_DIST/$asset" ]]; then
                gh release delete-asset nightly "$asset" --repo "$repo" --yes
              fi
            done
          gh release upload nightly "$GG_DIST"/* --repo "$repo" --clobber
          echo "### nightly: published Giga Grains $GG_VERSION as the nightly pre-release" >> "$GITHUB_STEP_SUMMARY"

      - name: Nightly publishing is off (nightly, until M5, or unsigned)
        if: ${{ needs.plan.outputs.release_kind == 'nightly' && (env.GG_PUBLISH_NIGHTLY != 'true' || needs.plan.outputs.sign != 'true') }}
        env:
          GG_SIGN_OUTPUT: ${{ needs.plan.outputs.sign }}
        run: |
          {
            if [[ "$GG_PUBLISH_NIGHTLY" != true ]]; then
              echo "### nightly: nightly publishing is off until M5 (GG_PUBLISH_NIGHTLY)"
            else
              echo "### nightly: not published, as the installers are unsigned (plan's sign=$GG_SIGN_OUTPUT)"
            fi
            echo "The installers are this run's installer-* artifacts. Nothing was published."
            echo '```'
            (cd "$GG_DIST" && ls -l)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List the files (dry-run)
        if: ${{ needs.plan.outputs.release_kind == 'dry-run' }}
        run: |
          {
            echo "### dry-run: nothing published"
            echo "A release of Giga Grains $GG_VERSION would carry these files; the installers are"
            echo "this run's installer-* artifacts."
            echo '```'
            (cd "$GG_DIST" && ls -l && cat SHA256SUMS.txt)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
