#
# The clang-format check: scripts/format.sh --check, which runs clang-format 23 with
# --dry-run --Werror over engine plugin ui tools tests clients. Its major version must match
# the one developers format with locally (Homebrew LLVM 23; ruling R6). Only clang-format is
# installed, not a whole LLVM toolchain: the PyPI clang-format wheel, in a venv, pinned to an
# exact version and SHA-256.
#
# Every third-party action is pinned by commit SHA, with its tag or branch in the comment
# beside it.

name: Format

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # clang-format 23.1.3 is the newest 23.x wheel on PyPI (2026-10-26); developers' Homebrew
      # LLVM is 23.1.4. format.sh requires only the major version, and both versions pass
      # format.sh --check on the same tree. The hash is the manylinux x86_64 wheel's
      # (clang_format-23.1.3-py2.py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl).
      - name: Install clang-format 23
        run: |
          venv="$RUNNER_TEMP/clang-format"
          python3 -m venv "$venv"
          requirements="$RUNNER_TEMP/clang-format-requirements.txt"
          echo "clang-format==23.1.3 --hash=sha256:58bf1804216501669832a39f2415e14284337438a062ff564729792adec664ac" > "$requirements"
          "$venv/bin/pip" install --quiet --only-binary :all: --require-hashes -r "$requirements"
          "$venv/bin/clang-format" --version
          echo "CLANG_FORMAT=$venv/bin/clang-format" >> "$GITHUB_ENV"

      - name: Check formatting
        run: scripts/format.sh --check
